[package]
name = "aim-threshold-tracker"
version = "1.0.0"
description = "Aim Threshold Tracker - Rastreador de thresholds de mira com watcher do KovaaK's"
authors = ["Arthur"]
edition = "2021"

[lib]
name = "aim_threshold_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
csv = "1"
chrono = "0.4"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
